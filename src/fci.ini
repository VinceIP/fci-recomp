; fci-recomp options
;
; To change a setting, remove the semicolon at the start of its line and edit the value.
; The values shown are the defaults.

;; System

; Folder for player profiles and save data.
;save-dir = %APPDATA%\fci-recomp\profile

; Folder for compiled shaders, so effects seen once no longer stutter the next time. Empty: none.
;shader-cache = %APPDATA%\fci-recomp\shader-cache

; How much to log.
; 0 - nothing
; 1 - crashes only: a session's log is kept only if it ended in a crash
; 2 - everything, for debugging
;log-verbosity = 1

; Number of log files to keep; older ones are deleted. 0 is unlimited.
;log-limit = 20

; Folder for log files.
;log-dir = %APPDATA%\fci-recomp\logs

; Log the controller state, four times a second (for control debugging).
; Probably hinders performance.
;log-input = 0

;; Display

; Borderless fullscreen. Alt+Enter also toggles it in-game.
;display-borderless = 0

; Window size when not fullscreen. auto: the largest window of the aspect ratio that fits the screen.
; Examples: 1280x960, 1920x1080, 2560x1440
;display-dimensions = auto

; Aspect ratio. Only supports the following for now.
; 0 - 4:3 (original)
; 1 - 16:9
;display-aspect = 0

; Unlock the frame rate above the original 30. Set to 0 to match native refresh rate.
; EXPERIMENTAL - May break game physics, AI, or cause other issues.
; In testing, Evolution's intro scene (the vehicle mounted gun run) will fail to play out above 60 fps,
; unless the engine cap is enabled (see below).
;display-frame-rate = 30

; Cap the rate at which the game engine updates (physics, AI, and more)
; Makes the game feel less smooth when the frame rate is set to more than 30,
; but it will enable a more faithful experience per the original Xbox game.
; Playing WITHOUT the cap and a frame rate over 30 may break some scripted AI sequences
; and/or softlock the game. Enable or disable this as needed.
; 1 - caps game engine updates to roughly 30hz and smooths out motion linearly to support high display frames.
; 0 - uncaps game engine updates. affects AI behavior, as well as vehicles and some physics -
; - but feels much better to play
;engine-update-cap = 1

; Disable startup/attract movies
;skip-intro-movies = 0

;; Graphics

; Internal resolution as a multiple of the original 640x480. Greatly affects overall image fidelity.
; auto gives the optimal setting for your display resolution; or set 0.25 to 4.
;gfx-res-scale = auto

; Anisotropic texture filtering. 0 to disable, or set between 2 and 16.
;gfx-anisotropic-filtering = 16

; Screen-space ambient occlusion
;gfx-ssao = 1

; Strength of the ambient occlusion.
;gfx-ssao-strength = 1.2

; Reach of the ambient occlusion, in metres.
;gfx-ssao-radius = 1.5

; Anti-aliasing: smooths jagged edges. 0 off, 1 on.
;gfx-aa = 1

; Sun shadow detail, as a multiple of the original 1024x1024 shadow map: 1 to 8.
; auto mirrors gfx-res-scale.
;gfx-shadow-scale = auto

; Softer shadow edges. 0 off, 1 on.
;gfx-shadow-filter = 1

; How far away objects are still drawn. The original game uses 48.
;gfx-object-draw-distance = 64

; How far away objects keep their detailed models. The original game uses 8.
;gfx-object-lod-distance = 16

; How far away plants and trees stay 3D before turning into flat sprites. The original game uses 7.2.
;gfx-foliage-lod = 16

;; Controls

; Enables mouse and keyboard. 0: controllers only.
;controls-mouse-keyboard = 1

;; Key bindings

; Keys and mouse buttons replace an Xbox controller. For several inputs on one control, separate
; them with commas. NONE disables a binding.
; Inputs: A-Z 0-9 F1-F24 SPACE ENTER ESCAPE TAB BACKSPACE LSHIFT RSHIFT LCTRL RCTRL LALT RALT
;   CAPSLOCK UP DOWN LEFT RIGHT INSERT DELETE HOME END PGUP PGDN NUMPAD0-9 MINUS EQUALS
;   LBRACKET RBRACKET SEMICOLON APOSTROPHE COMMA PERIOD SLASH BACKSLASH GRAVE
;   MOUSE1 (left) MOUSE2 (right) MOUSE3 (middle) MOUSE4 MOUSE5 WHEELUP WHEELDOWN

; Movement (the left stick)
;controls-bind-forward = W
;controls-bind-backwards = S
;controls-bind-strafe-left = A
;controls-bind-strafe-right = D
;controls-bind-walk = LCTRL

; optional right stick keybinds
;controls-bind-look-up = NONE
;controls-bind-look-down = NONE
;controls-bind-look-left = NONE
;controls-bind-look-right = NONE

; The Xbox controller's buttons
;controls-bind-rt = MOUSE1                  ; fire weapon
;controls-bind-lt = MOUSE2                  ; throw grenade
;controls-bind-rs = MOUSE3                  ; zoom in/aim weapon
;controls-bind-ls = LSHIFT                  ; crouch
;controls-bind-a = SPACE,ENTER              ; jump
;controls-bind-b = C,MOUSE4,BACKSPACE       ; melee attack
;controls-bind-x = E,R                      ; reload
;controls-bind-y = Q,WHEELUP,WHEELDOWN      ; 
;controls-bind-black = F                    ; change grenade type
;controls-bind-white = G                    ; set trap
;controls-bind-start = ESCAPE               ; show menu
;controls-bind-back = TAB                   ;
;controls-bind-dpad-up = UP,1               ;
;controls-bind-dpad-right = RIGHT,2         ; weapon selection
;controls-bind-dpad-down = DOWN,3           ;
;controls-bind-dpad-left = LEFT,4           ; weapon selection

;; Keyboard

; How far the left stick moves while the walk key is held (0 to 1).
;controls-walk-speed = 0.5

; How long a mouse wheel notch holds its button down, in milliseconds.
;controls-wheel-hold-ms = 80

;; Mouse

; Mouse look sensitivity.
;controls-mouse-sensitivity = 1.0

; Degrees the view turns per mouse count at sensitivity 1. The default, 0.05, is 7200 counts per full turn.
;controls-mouse-degrees = 0.05

; Direct mouse aim on foot: each mouse movement turns the view by an exact angle.
; 0: the mouse moves the right stick everywhere, with the game's own turn acceleration.
;controls-mouse-aim = 1

; Vertical sensitivity relative to horizontal.
;controls-mouse-y-scale = 1.0

; Invert vertical mouse look.
;controls-mouse-invert-y = 0

; Capture the mouse when you click in the window. Switching to another window releases it.
;controls-mouse-capture = 1

;; Mouse as right stick
; In menus, vehicles and the map editor the mouse moves the right stick instead of aiming directly.

; Response curve. Below 1, small mouse movements count for more.
;controls-mouse-stick-curve = 1.0

; Smallest stick movement a moving mouse produces, to get past the game's stick dead zone (0 to 1).
;controls-mouse-stick-deadzone = 0.0

; Time window the mouse speed is measured over, in milliseconds (about one game frame).
;controls-mouse-stick-window-ms = 33

;; Controller right stick

; Direct stick aim on foot: 1 turns the view straight from the right stick, past the game's own look (its
; axis snap, turn ramp and slowdown over targets), shaped by the options below. Vehicles and menus keep the
; game's handling. While it is on, the game's own invert and look sensitivity options do not apply.
; 0: the stick goes to the game as on the Xbox.
;controls-stick-aim = 0

; Turn speed at full deflection, in degrees per second. The game's own is about 166, after a ramp-up.
;controls-stick-speed = 180

; Vertical speed relative to horizontal.
;controls-stick-y-scale = 0.75

; Round dead zone: stick travel that does nothing (0 to 0.9). Raise it if the view drifts.
;controls-stick-deadzone = 0.12

; Response curve. Above 1, small deflections turn slower for fine aiming.
;controls-stick-curve = 1.8

; Holding the stick at its rim speeds the turn up to this multiple over boost-ms, as in Halo. 1: off.
;controls-stick-boost = 1.6
;controls-stick-boost-ms = 350

; Invert vertical stick look.
;controls-stick-invert-y = 0
